<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Previews</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <img class="logo-icon" src="../icons/icon-32.png" alt="Logo">
        <h1>Stream Previews</h1>
      </div>
      <span class="version">v0.6.0</span>
    </header>

    <main class="content">
      <!-- Preview Size -->
      <section class="section">
        <label class="section-title">
          <span>Preview Window Size</span>
          <span id="sizeDisplay" class="value-badge">480 &times; 270 px</span>
        </label>
        
        <div class="preset-buttons">
          <button type="button" class="preset-btn" data-width="360">360p</button>
          <button type="button" class="preset-btn active" data-width="480">480p</button>
          <button type="button" class="preset-btn" data-width="640">640p</button>
          <button type="button" class="preset-btn" data-width="800">800p</button>
        </div>

        <div class="slider-wrapper">
          <input type="range" id="sizeSlider" min="280" max="960" step="20" value="480">
        </div>
      </section>

      <!-- Audio Options -->
      <section class="section">
        <span class="section-title">Audio & Sound</span>
        
        <label class="toggle-row">
          <span class="toggle-label">Mute previews by default</span>
          <input type="checkbox" id="defaultMuted" checked>
          <span class="switch"></span>
        </label>

        <div class="slider-group" id="volumeGroup">
          <label class="slider-title">
            <span>Volume</span>
            <span id="volumeDisplay" class="value-badge">80%</span>
          </label>
          <div class="slider-wrapper">
            <input type="range" id="volumeSlider" min="5" max="100" step="5" value="80">
          </div>
        </div>
      </section>

      <!-- Dual+ Multi-View Borders -->
      <section class="section">
        <label class="section-title">
          <span>Stream Window Borders</span>
          <span id="borderModeDisplay" class="value-badge">Distinct</span>
        </label>

        <label class="toggle-row">
          <span class="toggle-label">Enable borders in Play Together</span>
          <input type="checkbox" id="tiledBorderEnabled" checked>
          <span class="switch"></span>
        </label>

        <div class="color-options-row" id="tiledBorderOptions">
          <button type="button" class="swatch-btn active" data-mode="distinct" title="Distinct (Multi-color per stream)">
            <span class="swatch-preview swatch-distinct"></span>
          </button>
          <button type="button" class="swatch-btn" data-mode="purple" data-color="#9146ff" title="Twitch Purple">
            <span class="swatch-preview" style="background-color: #9146ff;"></span>
          </button>
          <button type="button" class="swatch-btn" data-mode="green" data-color="#22c55e" title="Kick Green">
            <span class="swatch-preview" style="background-color: #22c55e;"></span>
          </button>
          <button type="button" class="swatch-btn" data-mode="cyan" data-color="#00e5ff" title="Electric Cyan">
            <span class="swatch-preview" style="background-color: #00e5ff;"></span>
          </button>
          <button type="button" class="swatch-btn" data-mode="orange" data-color="#ff7538" title="Neon Orange">
            <span class="swatch-preview" style="background-color: #ff7538;"></span>
          </button>
          <button type="button" class="swatch-btn swatch-custom-btn" id="customColorBtn" data-mode="custom" title="Custom Color Picker">
            <span class="swatch-preview swatch-custom-indicator" id="customColorIndicator" style="background-color: #9146ff;">
              <svg class="swatch-pipette-icon" viewBox="0 0 24 24" width="12" height="12">
                <path d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.93-1.91-1.41 1.41 1.42 1.42L3 16.25V21h4.75l8.92-8.92 1.42 1.42 1.41-1.41-1.92-1.92 3.12-3.12a1 1 0 0 0 .01-1.42zM6.92 19H5v-1.92l8.06-8.06 1.92 1.92L6.92 19z"/>
              </svg>
            </span>
          </button>
        </div>

        <!-- In-Popup Custom Color Picker Panel -->
        <div class="custom-color-panel hidden" id="customColorPanel">
          <div class="custom-chips-row">
            <button type="button" class="color-chip" data-color="#ef4444" style="background-color: #ef4444;" title="Red"></button>
            <button type="button" class="color-chip" data-color="#f97316" style="background-color: #f97316;" title="Orange"></button>
            <button type="button" class="color-chip" data-color="#eab308" style="background-color: #eab308;" title="Yellow"></button>
            <button type="button" class="color-chip" data-color="#84cc16" style="background-color: #84cc16;" title="Lime"></button>
            <button type="button" class="color-chip" data-color="#22c55e" style="background-color: #22c55e;" title="Green"></button>
            <button type="button" class="color-chip" data-color="#06b6d4" style="background-color: #06b6d4;" title="Cyan"></button>
            <button type="button" class="color-chip" data-color="#3b82f6" style="background-color: #3b82f6;" title="Blue"></button>
            <button type="button" class="color-chip" data-color="#9146ff" style="background-color: #9146ff;" title="Purple"></button>
            <button type="button" class="color-chip" data-color="#ec4899" style="background-color: #ec4899;" title="Pink"></button>
            <button type="button" class="color-chip" data-color="#ffffff" style="background-color: #ffffff;" title="White"></button>
          </div>
          <div class="picker-bottom-row">
            <span class="custom-preview-dot" id="pickerPreviewDot" title="Current shade preview"></span>
            <div class="shade-slider-track">
              <input type="range" id="customShadeSlider" min="0" max="100" value="50" class="shade-slider" title="Drag left for darker shades, right for lighter shades">
            </div>
            <div class="custom-hex-box">
              <span class="custom-hex-prefix">#</span>
              <input type="text" id="customHexInput" class="custom-hex-input" maxlength="6" placeholder="9146FF" spellcheck="false" title="Hex code">
            </div>
          </div>
        </div>
      </section>

      <!-- Hover Delay -->
      <section class="section">
        <label class="section-title">
          <span>Hover Trigger Delay</span>
          <span id="delayDisplay" class="value-badge">300 ms</span>
        </label>
        <div class="slider-wrapper">
          <input type="range" id="delaySlider" min="100" max="1000" step="50" value="300">
        </div>
      </section>

      <!-- Platforms -->
      <section class="section">
        <span class="section-title">Active Platforms</span>
        <div class="platforms-grid">
          <label class="toggle-row platform-row">
            <span class="toggle-label platform-label twitch">
              <span class="dot twitch-dot"></span> Twitch
            </span>
            <input type="checkbox" id="enabledTwitch" checked>
            <span class="switch"></span>
          </label>

          <label class="toggle-row platform-row">
            <span class="toggle-label platform-label kick">
              <span class="dot kick-dot"></span> Kick
            </span>
            <input type="checkbox" id="enabledKick" checked>
            <span class="switch"></span>
          </label>
        </div>
      </section>

      <!-- Shortcuts Guide -->
      <footer class="shortcuts-footer">
        <div class="shortcut-item"><kbd>M</kbd> <span>Sound</span></div>
        <div class="shortcut-item"><kbd>T</kbd> <span>Together</span></div>
        <div class="shortcut-item"><kbd>P</kbd> <span>Pin</span></div>
        <div class="shortcut-item"><kbd>S</kbd> <span>Swap</span></div>
        <div class="shortcut-item"><kbd>Esc</kbd> <span>Close</span></div>
      </footer>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
